            <button type="button" class="style-option" role="menuitemradio" data-pet="slime"><span class="style-swatch pet-swatch"></span>Slime</button>
        </div>
    </div>

    <div id="resources-menu">
        <div id="resources-panel" role="dialog" aria-label="Helpful resources" hidden>
            <div class="resources-title">Helpful Resources</div>
            <ul id="resources-list"></ul>
        </div>
        <button type="button" id="resources-btn" class="btn" aria-haspopup="true" aria-expanded="false" aria-controls="resources-panel">Resources</button>
    </div>
    <div id="pet" hidden title="Click me, or pet me by moving your mouse back and forth!"><div class="pet-heart"></div><div class="pet-hop"><div class="pet-sprite"></div></div></div>

    <aside id="course-sidebar" aria-label="Course outline"></aside>
    <div id="sidebar-backdrop"></div>
    <button type="button" id="sidebar-open-btn" class="btn" aria-label="Show course outline" title="Show course outline">☰ Outline</button>

    <div id="app"></div>

    <script src="curriculum.js"></script>
    <script src="warmups.js"></script>
    <script src="agendas.js"></script>
    <script src="resources.js"></script>

    <script>

        // File types are matched in lowercase, so "WFR" and "wfr" both work in curriculum.js.
        Object.values(curriculum).forEach(files => files.forEach(item => { item.type = item.type.toLowerCase(); }));

        // --- 0. STYLE MENU (THEMES + SEAMLESS MODE) ---
        const body = document.body;
        const themeClasses = ['light-mode', 'ocean-mode', 'forest-mode', 'sunset-mode', 'hacker-mode', 'pink-mode', 'oldschool-mode'];
        const styleMenuBtn = document.getElementById('style-menu-btn');
        const styleMenuPanel = document.getElementById('style-menu-panel');
        const themeOptions = [...styleMenuPanel.querySelectorAll('[data-theme]')];
        const seamlessOption = document.getElementById('seamless-option');

        function applyTheme(theme) {
            body.classList.remove(...themeClasses);
            if (theme !== 'dark') body.classList.add(theme + '-mode');
            themeOptions.forEach(option => option.setAttribute('aria-checked', String(option.dataset.theme === theme)));
        }

        // Seamless mode drops the box behind the page content so it sits right on the background.
        function applySeamless(on) {
            body.classList.toggle('seamless', on);
            seamlessOption.setAttribute('aria-checked', String(on));
        }

        // Anyone who picked the old Goth theme moves over to Hacker, its replacement.
        if (localStorage.getItem('theme') === 'goth') localStorage.setItem('theme', 'hacker');
        applyTheme(localStorage.getItem('theme') || 'dark');
        applySeamless(localStorage.getItem('seamless') === 'true');

        function setStyleMenuOpen(open) {
            styleMenuPanel.hidden = !open;
            styleMenuBtn.setAttribute('aria-expanded', String(open));
        }

        styleMenuBtn.addEventListener('click', () => setStyleMenuOpen(styleMenuPanel.hidden));

        themeOptions.forEach(option => option.addEventListener('click', () => {
            const theme = option.dataset.theme;
            applyTheme(theme);
            localStorage.setItem('theme', theme);
            // Re-render the current view so Mermaid diagrams pick up the new theme.
            render();
        }));

        seamlessOption.addEventListener('click', () => {
            const on = !body.classList.contains('seamless');
            applySeamless(on);
            localStorage.setItem('seamless', String(on));
        });

        // Default lab view: whether file pages open in the full lab or in checklist mode.
        // Pages without a checklist always open in the full lab.
        const labViewOptions = [...styleMenuPanel.querySelectorAll('[data-lab-view]')];

        function getDefaultLabView() {
            return localStorage.getItem('defaultLabView') === 'checklist' ? 'checklist' : 'full';
        }

        function applyDefaultLabView(view) {
            labViewOptions.forEach(option => option.setAttribute('aria-checked', String(option.dataset.labView === view)));
        }
        applyDefaultLabView(getDefaultLabView());
        Object.keys(localStorage).filter(key => key.startsWith('checklistMode-')).forEach(key => localStorage.removeItem(key));

        labViewOptions.forEach(option => option.addEventListener('click', () => {
            const view = option.dataset.labView;
            applyDefaultLabView(view);
            localStorage.setItem('defaultLabView', view);
            // Switch the page that's open right now too, if it has a checklist.
            document.getElementById('checklist-toggle-btn')?.dispatchEvent(new CustomEvent('set-view', { detail: view }));
        }));

        // One step at a time: checklists show a single "Step" section until every box in it is checked.
        const oneStepOption = document.getElementById('one-step-option');
        let refreshOneStep = null; // Set by setUpChecklist() so the open checklist updates right away.

        function isOneStepMode() {
            return localStorage.getItem('checklistOneStep') === 'true';
        }
        oneStepOption.setAttribute('aria-checked', String(isOneStepMode()));

        oneStepOption.addEventListener('click', () => {
            const on = !isOneStepMode();
            localStorage.setItem('checklistOneStep', String(on));
            oneStepOption.setAttribute('aria-checked', String(on));
            refreshOneStep?.();
        });

        // Close the menu when clicking anywhere else or pressing Escape.
        document.addEventListener('click', (event) => {
            if (!styleMenuPanel.hidden && !event.target.closest('#style-menu')) setStyleMenuOpen(false);
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !styleMenuPanel.hidden) {
                setStyleMenuOpen(false);
                styleMenuBtn.focus();
            }
        });

        // --- RESOURCES BUTTON (bottom right of every page; links come from resources.js) ---
        const resourcesBtn = document.getElementById('resources-btn');
        const resourcesPanel = document.getElementById('resources-panel');
        const resourcesList = document.getElementById('resources-list');

        (typeof studentResources === 'undefined' ? [] : studentResources).forEach(resource => {
            const item = document.createElement('li');
            const link = document.createElement('a');
            link.href = resource.url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = resource.name;
            item.appendChild(link);
            if (resource.description) {
                const note = document.createElement('span');
                note.className = 'resource-description';
                note.textContent = resource.description;
                item.appendChild(note);
            }
            resourcesList.appendChild(item);
        });
        if (!resourcesList.children.length) document.getElementById('resources-menu').hidden = true;

        function setResourcesOpen(open) {
            resourcesPanel.hidden = !open;
            resourcesBtn.setAttribute('aria-expanded', String(open));
        }
        resourcesBtn.addEventListener('click', () => setResourcesOpen(resourcesPanel.hidden));
        document.addEventListener('click', (event) => {
            if (!resourcesPanel.hidden && !event.target.closest('#resources-menu')) setResourcesOpen(false);
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !resourcesPanel.hidden) {
                setResourcesOpen(false);
                resourcesBtn.focus();
            }
        });

        // --- 8-BIT PET ---
        // Each pet is pixel art drawn from the grids below (facing left), one
        // character per pixel. "." is see-through; other letters are colors
        // from the pet's palette. Two frames make a walk cycle; one frame squishes.
        const PET_BODY = [
            ".koooookkkkkkkok",
            ".koooooooooooook",
            ".kooooooooooook.",
            "..kooooooooook..",
        ];
        const PET_LEGS = [
            ["..ko.ko...ko.ko.", "..kk.kk...kk.kk."],
            ["...ko.ko.ko.ko..", "...kk.kk.kk.kk.."],
        ];
        const CAT_HEAD = [
            ".k...k..........",
            "kok.kok.........",
            "kooooook.......k",
            "koeooeok......ko",
            "kooppook......ko",
            ".kooook.......ko",
        ];
        // German Shepherd: big upright ears, black saddle, tan legs, dark muzzle, bushy tail.
        const DOG_TOP = [
            "..k..k..........",
            ".kbkkbk.........",
            ".kbttbk.........",
            ".kttettk........",
            "nmmttttkkkkkkk..",
            ".kkkttbbbbbbbbk.",
            "...kttbbbbbbbbkk",
            "...kttttbbbbtkbk",
            "...kttttttttkbbk",
        ];
        const DOG_LEGS = [
            ["...kt.kt..kt.kbk", "...kt.kt..kt.kt.", "...kk.kk..kk.kk."],
            ["...kt.kt..kt.kbk", "....kt.kt.kt.kt.", "....kk.kk.kk.kk."],
        ];
        const PETS = {
            cat: {
                palette: { k: '#1a1a1a', o: '#f59e0b', e: '#111111', p: '#f9a8d4' },
                frames: PET_LEGS.map(legs => [...CAT_HEAD, ...PET_BODY, ...legs]),
                speed: 45,
            },
            dog: {
                palette: { k: '#1a1a1a', b: '#2f2a26', t: '#c98a3d', m: '#3b2f25', e: '#111111', n: '#111111' },
                frames: DOG_LEGS.map(legs => [...DOG_TOP, ...legs]),
                speed: 55,
            },
            duck: {
                palette: { k: '#1a1a1a', w: '#f8fafc', e: '#111111', o: '#f97316', g: '#cbd5e1' },
                frames: ["....oo...oo.....", ".....oo.oo......"].map(feet => [
                    "....kkkk........",
                    "...kwwwwk.......",
                    "...kwewwk.......",
                    ".oooowwwk.......",
                    "..ookwwwk.......",
                    "....kwwwk.......",
                    "...kwwwwkkkkk..k",
                    "..kwwwwwwwwwwkwk",
                    "..kwwwgggwwwwwk.",
                    "..kwwwwgggwwwk..",
                    "...kkkkkkkkkk...",
                    feet,
                ]),
                speed: 35,
            },
            slime: {
                palette: { k: '#14532d', o: '#4ade80', w: '#f0fdf4', e: '#14532d' },
                frames: [[
                    "................",
                    "................",
                    "................",
                    "....kkkkkkkk....",
                    "...koooooowwk...",
                    "..koooooooowwk..",
                    ".kooeooooeooook.",
                    ".kooooooooooook.",
                    "kooooooooooooook",
                    "kooooooooooooook",
                    ".kkkkkkkkkkkkkk.",
                    "................",
                ]],
                speed: 25,
            },
        };

        // Turn a pixel grid into an image the browser can use as a background.
        function drawPetFrame(grid, palette) {
            const canvas = document.createElement('canvas');
            canvas.width = grid[0].length;
            canvas.height = grid.length;
            const ctx = canvas.getContext('2d');
            grid.forEach((row, y) => [...row].forEach((pixel, x) => {
                if (pixel === '.' || !palette[pixel]) return;
                ctx.fillStyle = palette[pixel];
                ctx.fillRect(x, y, 1, 1);
            }));
            return `url(${canvas.toDataURL()})`;
        }
        Object.values(PETS).forEach(pet => { pet.images = pet.frames.map(grid => drawPetFrame(grid, pet.palette)); });

        const petEl = document.getElementById('pet');
        const petSprite = petEl.querySelector('.pet-sprite');
        const petOptions = [...styleMenuPanel.querySelectorAll('[data-pet]')];
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        petOptions.forEach(option => {
            const pet = PETS[option.dataset.pet];
            if (pet) option.querySelector('.pet-swatch').style.backgroundImage = pet.images[0];
        });

        const petState = { type: null, x: 0, target: 0, restUntil: 0, lastTime: 0, stepTime: 0, frame: 0, rafId: null };

        function petMaxX() { return Math.max(0, window.innerWidth - petEl.offsetWidth); }

        function petTick(time) {
            const pet = PETS[petState.type];
            if (!pet) return;
            const dt = Math.min((time - petState.lastTime) / 1000, 0.1);
            petState.lastTime = time;

            const walking = time >= petState.restUntil && !reduceMotion.matches;
            if (walking) {
                const distance = petState.target - petState.x;
                if (Math.abs(distance) < 2) {
                    // Arrived: rest for a moment, then pick somewhere new to wander.
                    petState.restUntil = time + 1000 + Math.random() * 3000;
                    petState.target = Math.random() * petMaxX();
                } else {
                    const direction = Math.sign(distance);
                    petState.x += direction * Math.min(Math.abs(distance), pet.speed * dt);
                    petEl.classList.toggle('facing-right', direction > 0);
                    if (time - petState.stepTime > 180) {
                        petState.stepTime = time;
                        petState.frame = (petState.frame + 1) % 2;
                    }
                }
            } else {
                petState.frame = 0;
            }

            const images = pet.images;
            petSprite.style.backgroundImage = images[petState.frame % images.length];
            petEl.classList.toggle('squish', images.length === 1 && petState.frame === 1);
            petEl.style.left = `${Math.min(petState.x, petMaxX())}px`;
            petState.rafId = requestAnimationFrame(petTick);
        }

        function applyPet(type) {
            if (!PETS[type]) type = 'none';
            petOptions.forEach(option => option.setAttribute('aria-checked', String(option.dataset.pet === type)));
            cancelAnimationFrame(petState.rafId);
            petState.type = type;
            petEl.hidden = type === 'none';
            if (type === 'none') return;

            petState.x = Math.random() * petMaxX();
            petState.target = Math.random() * petMaxX();
            petState.restUntil = 0;
            petState.lastTime = performance.now();
            petState.rafId = requestAnimationFrame(petTick);
        }

        petOptions.forEach(option => option.addEventListener('click', () => {
            applyPet(option.dataset.pet);
            localStorage.setItem('pet', option.dataset.pet);
        }));

        // Click the pet to make it hop.
        petEl.addEventListener('click', () => {
            petEl.classList.remove('hopping');
            void petEl.offsetWidth; // Restart the animation if it's already hopping.
            petEl.classList.add('hopping');
        });
        petEl.addEventListener('animationend', () => petEl.classList.remove('hopping'));

        // Pet the pet: rub the mouse (or a finger) back and forth over it and
        // it stops walking and shows a little heart in a speech bubble.
        petEl.querySelector('.pet-heart').style.backgroundImage = drawPetFrame([
            ".kkkkkkkkkkk.",
            "kwwwwwwwwwwwk",
            "kwwwwwwwwwwwk",
            "kwwwrrwrrwwwk",
            "kwwrrrrrrrwwk",
            "kwwrrrrrrrwwk",
            "kwwwrrrrrwwwk",
            "kwwwwrrrwwwwk",
            "kwwwwwrwwwwwk",
            "kwwwwwwwwwwwk",
            ".kkkkwkkkkkk.",
            "....kk.......",
        ], { k: '#1a1a1a', w: '#ffffff', r: '#ef4444' });

        const petting = { lastX: null, direction: 0, travel: 0, rubs: [], heartTimer: null };

        petEl.addEventListener('pointermove', (event) => {
            const now = performance.now();
            // Hold still while someone's hand is on it.
            petState.restUntil = Math.max(petState.restUntil, now + 600);

            if (petting.lastX !== null) {
                const dx = event.clientX - petting.lastX;
                const direction = Math.sign(dx);
                if (direction !== 0) {
                    if (direction === petting.direction) {
                        petting.travel += Math.abs(dx);
                    } else {
                        // Changing direction after a real stroke counts as one rub.
                        if (petting.direction !== 0 && petting.travel >= 6) petting.rubs.push(now);
                        petting.direction = direction;
                        petting.travel = Math.abs(dx);
                    }
                }
            }
            petting.lastX = event.clientX;

            // Three rubs within a second and a half means it's being petted.
            petting.rubs = petting.rubs.filter(time => now - time < 1500);
            if (petting.rubs.length >= 3) {
                petting.rubs = [];
                petEl.classList.add('loved');
                petState.restUntil = Math.max(petState.restUntil, now + 1800);
                clearTimeout(petting.heartTimer);
                petting.heartTimer = setTimeout(() => petEl.classList.remove('loved'), 1800);
            }
        });

        petEl.addEventListener('pointerleave', () => {
            petting.lastX = null;
            petting.direction = 0;
            petting.travel = 0;
        });

        applyPet(localStorage.getItem('pet') || 'none');

        // --- Mermaid Diagram Setup ---
        function getMermaidTheme() {
            return ['light-mode', 'pink-mode', 'oldschool-mode'].some(name => body.classList.contains(name)) ? 'default' : 'dark';
        }

        const appDiv = document.getElementById('app');

        // --- 2. ROUTING LOGIC ---
        function render() {
            const hash = window.location.hash.substring(1);

            // The course outline only shows on file pages; renderAssignment turns it back on.
            body.classList.remove('has-sidebar');

            if (!hash) {
                renderHub();
            } else if (hash === ABOUT_PAGE) {
                renderAboutPage();
            } else if (hash.includes('/')) {
                // Everything after the class name is the file's path, so warm-ups
                // (#Class/Warm-Ups/File) load from the class's Warm-Ups folder.
                const [className, ...filePath] = hash.split('/');
                renderAssignment(className, filePath.join('/'));
            } else {
                renderClassPage(hash);
            }
        }

        // --- Helper Function to get Badge Class ---
        function getBadgeClass(type) {
            if (type === 'notes') return 'badge-notes';
            if (type === 'assignment') return 'badge-assignment';
            if (type === 'exercise') return 'badge-exercise';
            if (type === 'optional') return 'badge-optional';
            if (type === 'document') return 'badge-document';
            if (type === 'wfr') return 'badge-wfr';
            return ''; // Default fallback
        }

        // --- Helper Function to get a Friendly Plural Label for a Type Filter Option ---
        const TYPE_FILTER_ORDER = ['notes', 'document', 'assignment', 'exercise', 'optional', 'wfr'];
        const TYPE_FILTER_LABELS = {
            notes: 'Notes',
            document: 'Documents',
            assignment: 'Assignments',
            exercise: 'Exercises',
            optional: 'Optional',
            wfr: 'WFR'
        };

        function generateTypeFilterHTML(files) {
            const typesPresent = new Set(files.map(item => item.type));
            const orderedTypes = TYPE_FILTER_ORDER.filter(type => typesPresent.has(type));

            let html = `<option value="all">All Types</option>`;
            orderedTypes.forEach(type => {
                const label = TYPE_FILTER_LABELS[type] || type;
                html += `<option value="${type}">${label}</option>`;
            });
            return html;
        }

        // --- Helper Function to Render List Items (flat, no unit grouping) ---
        function generateFileListHTML(className, files) {
            if (files.length === 0) return `<p>No matching files found.</p>`;

            let html = '';
            files.forEach(item => {
                const cleanFileName = item.file.replace(/-/g, ' ');
                const badgeClass = getBadgeClass(item.type);

                html += `
                    <a href="#${className}/${item.file}" class="list-item">
                        <span class="list-item-text">${cleanFileName}</span>
                        <span class="badge ${badgeClass}">${item.type.toUpperCase()}</span>
                    </a>
                `;
            });
            return html;
        }

        // --- Unit Visibility Persistence (per-visitor, saved in their browser) ---
        function getHiddenUnits(className) {
            try {
                return new Set(JSON.parse(localStorage.getItem(`hiddenUnits-${className}`)) || []);
            } catch (e) {
                return new Set();
            }
        }

        function setHiddenUnits(className, hiddenUnits) {
            localStorage.setItem(`hiddenUnits-${className}`, JSON.stringify([...hiddenUnits]));
        }

        // --- Unit Naming & Author-Level Visibility (from unitInfo in curriculum.js) ---
        function getUnitLabel(className, unit) {
            const name = unitInfo[className]?.[unit]?.name;
            return name ? `Unit ${unit}: ${name}` : `Unit ${unit}`;
        }

        function isUnitVisible(className, unit) {
            return unitInfo[className]?.[unit]?.visible !== false;
        }

        // Files in the class, minus any units the author has hidden entirely.
        function getPublishedFiles(className, files) {
            return files.filter(item => isUnitVisible(className, item.unit ?? 0));
        }

        // --- Helper Function to Render Files Grouped by Unit, With Collapsible Headers ---
        // Each unit's heading always shows (with a VS Code-style fold arrow); only its
        // file list collapses when a visitor hides it, so units never fully disappear.
        function generateGroupedFileListHTML(className, files, hiddenUnits, releasedWarmups = []) {
            const publishedFiles = getPublishedFiles(className, files);
            if (publishedFiles.length === 0 && releasedWarmups.length === 0) return `<p>No matching files found.</p>`;

            const units = [...new Set([...publishedFiles, ...releasedWarmups].map(item => item.unit ?? 0))].sort((a, b) => a - b);

            let html = '';
            units.forEach(unit => {
                const unitFiles = publishedFiles.filter(item => (item.unit ?? 0) === unit);
                const unitWarmups = releasedWarmups.filter(item => (item.unit ?? 0) === unit);
                const collapsed = hiddenUnits.has(unit);
                html += `<div class="unit-section">
                    <h3 class="unit-heading${collapsed ? ' collapsed' : ''}" data-unit="${unit}" role="button" tabindex="0" aria-expanded="${!collapsed}">
                        <span class="unit-fold-arrow">▶</span>${getUnitLabel(className, unit)}
                    </h3>
                    <div class="unit-files"${collapsed ? ' hidden' : ''}>
                        ${generateUnitWarmupsHTML(className, unitWarmups)}
                        ${unitFiles.length ? generateFileListHTML(className, unitFiles) : ''}
                    </div>
                </div>`;
            });
            return html;
        }

        // --- Warm-Ups (from warmups.js) ---
        const WARMUP_FOLDER = 'Warm-Ups';

        // Today's date in the visitor's own time zone, as "YYYY-MM-DD".
        function getTodayString() {
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${now.getFullYear()}-${month}-${day}`;
        }

        function formatWarmupDate(dateString) {
            const [year, month, day] = dateString.split('-').map(Number);
            return new Date(year, month - 1, day).toLocaleDateString(undefined, {
                weekday: 'long', month: 'long', day: 'numeric'
            });
        }

        // Warm-ups whose date has arrived, newest first. Future warm-ups (and
        // any in a unit the author has hidden) stay off the site until their day.
        function getReleasedWarmups(className) {
            const today = getTodayString();
            return (warmups[className] || [])
                .filter(item => item.date <= today && isUnitVisible(className, item.unit ?? 0))
                .sort((a, b) => b.date.localeCompare(a.date));
        }

        // A unit's warm-ups as one collapsible row, newest first, each a link to its own page.
        function generateUnitWarmupsHTML(className, unitWarmups) {
            if (unitWarmups.length === 0) return '';

            const today = getTodayString();
            let html = `<details class="unit-warmups">
                <summary>Warm-Ups (${unitWarmups.length})</summary>`;
            unitWarmups.forEach(item => {
                html += `
                    <a href="#${className}/${WARMUP_FOLDER}/${item.file}" class="list-item">
                        <span class="list-item-text">${item.file.replace(/-/g, ' ')}</span>
                        <span class="day-date">${item.date === today ? 'Today' : formatWarmupDate(item.date)}</span>
                    </a>
                `;
            });
            html += `</details>`;
            return html;
        }

        // --- Agendas (from agendas.js) ---
        const AGENDA_FOLDER = 'Agendas';

        // Agenda dates that have arrived, newest first. Future agendas stay
        // off the site until their day, so they can be written ahead of time.
        function getReleasedAgendas(className) {
            const today = getTodayString();
            return (agendas[className] || [])
                .filter(date => date <= today)
                .sort((a, b) => b.localeCompare(a));
        }

        // The "Past agendas" list: each one a link to its own page.
        function generateAgendaArchiveHTML(className, pastAgendas) {
            if (pastAgendas.length === 0) return '';

            let html = `<details class="agenda-archive">
                <summary>Past agendas (${pastAgendas.length})</summary>`;
            pastAgendas.forEach(date => {
                html += `
                    <a href="#${className}/${AGENDA_FOLDER}/${date}" class="list-item">
                        <span class="list-item-text">${formatWarmupDate(date)}</span>
                    </a>
                `;
            });
            html += `</details>`;
            return html;
        }

        // Fills the box at the top of a class page: today's agenda shown in
        // full, every earlier one listed underneath as a link to click through.
        async function renderAgendaBox(className, boxEl) {
            const released = getReleasedAgendas(className);
            if (released.length === 0) return; // No agendas yet: leave the box hidden.

            const today = getTodayString();
            const past = released.filter(date => date !== today);

            let todayHtml;
            if (released[0] === today) {
                try {
                    const response = await fetch(`markdown/${className}/${AGENDA_FOLDER}/${today}.md`);
                    if (!response.ok) throw new Error('Agenda file not found.');
                    todayHtml = `<div class="markdown-body">${marked.parse(await response.text())}</div>`;
                } catch (error) {
                    todayHtml = `<div class="error"><strong>Error:</strong> Could not load <code>markdown/${className}/${AGENDA_FOLDER}/${today}.md</code>.</div>`;
                }
            } else {
                todayHtml = `<p class="agenda-empty">No agenda posted for today.</p>`;
            }

            // The visitor may have left this class page while the file was loading.
            if (!boxEl.isConnected) return;

            // A visitor can fold today's agenda away. The choice is saved with
            // today's date, so tomorrow's agenda shows up open again.
            const hiddenKey = `hiddenAgenda-${className}`;
            const collapsed = localStorage.getItem(hiddenKey) === today;

            boxEl.innerHTML = `
                <div class="agenda-header${collapsed ? ' collapsed' : ''}" role="button" tabindex="0" aria-expanded="${!collapsed}" title="Click to hide or show the agenda">
                    <span class="day-label"><span class="unit-fold-arrow">▶</span>Today's Agenda</span>
                    <span class="day-date">${formatWarmupDate(today)}</span>
                </div>
                <div class="agenda-today"${collapsed ? ' hidden' : ''}>
                    ${todayHtml}
                    ${generateAgendaArchiveHTML(className, past)}
                </div>
            `;
            boxEl.hidden = false;

            const headerEl = boxEl.querySelector('.agenda-header');
            const todayEl = boxEl.querySelector('.agenda-today');

            function toggleAgenda() {
                const nowCollapsed = !headerEl.classList.contains('collapsed');
                headerEl.classList.toggle('collapsed', nowCollapsed);
                headerEl.setAttribute('aria-expanded', String(!nowCollapsed));
                todayEl.hidden = nowCollapsed;
                if (nowCollapsed) localStorage.setItem(hiddenKey, today);
                else localStorage.removeItem(hiddenKey);
            }

            headerEl.addEventListener('click', toggleAgenda);
            headerEl.addEventListener('keydown', (event) => {
                if (event.key !== 'Enter' && event.key !== ' ') return;
                event.preventDefault();
                toggleAgenda();
            });
            await enhanceMarkdown(`${className.replace(/-/g, ' ')} Agenda`);
        }

        // --- 3. RENDER FUNCTIONS ---
        function renderHub() {
            let html = `
                <h1>EPIC Software Development Courses</h1>
                
                <div class="search-container">
                    <input type="text" id="search-input" class="search-bar" placeholder="Search all files globally...">
                </div>

                <div id="default-view">
                    <p>Select a class to view assignments and notes:</p>
                    <div class="grid">
            `;
            
            for (const className in curriculum) {
                const displayName = className.replace(/-/g, ' ');
                // Optional header photo, set in classImages in curriculum.js.
                const image = typeof classImages !== 'undefined' ? classImages[className] : null;
                html += image
                    ? `<a href="#${className}" class="card card-with-image">
                           <img src="${image}" alt="" class="card-image" loading="lazy">
                           <span class="card-title">${displayName}</span>
                       </a>`
                    : `<a href="#${className}" class="card">${displayName}</a>`;
            }
            
            html += `
                    </div>
                    ${SHOW_ABOUT_BUTTON ? `<div class="about-link">
                        <a href="#${ABOUT_PAGE}" class="btn">About Me</a>
                    </div>` : ''}
                </div>
                <div id="search-results"></div>
            `;
            
            appDiv.innerHTML = html;
            document.getElementById('search-input').addEventListener('input', handleGlobalSearch);
        }

        // --- About Me page (markdown/About-Me.md), linked from the hub ---
        const ABOUT_PAGE = 'About-Me';
        // Set to true to show the About Me button under the class cards.
        const SHOW_ABOUT_BUTTON = false;

        async function renderAboutPage() {
            appDiv.innerHTML = `<p>Loading...</p>`;
            try {
                const response = await fetch(`markdown/${ABOUT_PAGE}.md`);
                if (!response.ok) throw new Error('Markdown file not found.');

                appDiv.innerHTML = `
                    <div class="nav-buttons">

                    </div>

                    </div>
                `;
                await enhanceMarkdown('About Me');
            } catch (error) {

                    </div>

        // --- 4. GLOBAL SEARCH LOGIC ---
        function handleGlobalSearch(event) {
            const query = event.target.value.toLowerCase();
            const defaultView = document.getElementById('default-view');
            const searchResults = document.getElementById('search-results');

            if (query.trim() === '') {
                defaultView.style.display = 'block';
                searchResults.innerHTML = '';
                return;
            }

            defaultView.style.display = 'none';
            let resultsHtml = `<h3>Search Results</h3><div>`;
            let matchCount = 0;

            for (const className in curriculum) {
                getPublishedFiles(className, curriculum[className]).forEach(item => {
                    const cleanFileName = item.file.replace(/-/g, ' ');
                    const cleanClassName = className.replace(/-/g, ' ');
                    
                    if (cleanFileName.toLowerCase().includes(query) || 
                        cleanClassName.toLowerCase().includes(query) ||
                        item.type.toLowerCase().includes(query)) {
                        
                        const badgeClass = getBadgeClass(item.type);
                        
                        resultsHtml += `
                            <a href="#${className}/${item.file}" class="list-item">
                                <span class="list-item-text"><strong>${cleanClassName}</strong>: ${cleanFileName}</span>
                                <span class="badge ${badgeClass}">${item.type.toUpperCase()}</span>
                            </a>
                        `;
                        matchCount++;
                    }
                });
            }

            resultsHtml += `</div>`;

            if (matchCount === 0) {
                searchResults.innerHTML = `<p>No files found matching "${query}".</p>`;
            } else {
                searchResults.innerHTML = resultsHtml;
            }
        }

        // --- 5. CLASS PAGE WITH SEARCH ---
        function renderClassPage(className) {
            if (!curriculum[className]) return renderHub();

            const displayName = className.replace(/-/g, ' ');
            const hiddenUnits = getHiddenUnits(className);
            const publishedFiles = getPublishedFiles(className, curriculum[className]);

            let html = `
                <div class="nav-buttons">
                    <a href="#" class="btn">← Back to All Courses</a>
                </div>
                <section id="agenda-box" class="agenda-box" hidden></section>

                <h2>${displayName} Files</h2>

                <div class="search-container">
                    <input type="text" id="class-search-input" class="search-bar" placeholder="Search within ${displayName}...">
                    <select id="class-type-filter" class="type-filter-select" aria-label="Filter by type">
                        ${generateTypeFilterHTML(publishedFiles)}
                    </select>
                </div>

                <div id="class-file-list">
                    ${generateGroupedFileListHTML(className, curriculum[className], hiddenUnits, getReleasedWarmups(className))}
                </div>
            `;

            appDiv.innerHTML = html;
            renderAgendaBox(className, document.getElementById('agenda-box'));

            const fileListEl = document.getElementById('class-file-list');

            function refreshFileList() {
                const query = document.getElementById('class-search-input').value.toLowerCase();
                const selectedType = document.getElementById('class-type-filter').value;

                const filteredFiles = curriculum[className].filter(item => {
                    const cleanFileName = item.file.replace(/-/g, ' ').toLowerCase();
                    const matchesQuery = cleanFileName.includes(query) || item.type.includes(query);
                    const matchesType = selectedType === 'all' || item.type === selectedType;
                    return matchesQuery && matchesType;
                });

                // Warm-ups match the search by name, and only show under "All Types".
                const filteredWarmups = selectedType === 'all'
                    ? getReleasedWarmups(className).filter(item => item.file.replace(/-/g, ' ').toLowerCase().includes(query))
                    : [];

                fileListEl.innerHTML = generateGroupedFileListHTML(className, filteredFiles, getHiddenUnits(className), filteredWarmups);
            }

            document.getElementById('class-search-input').addEventListener('input', refreshFileList);
            document.getElementById('class-type-filter').addEventListener('change', refreshFileList);

            // Click (or keyboard-activate) a unit heading to fold/unfold it,
            // VS Code-style — the heading stays put, only its file list collapses.
            function toggleUnitSection(heading) {
                const unit = Number(heading.dataset.unit);
                const filesEl = heading.nextElementSibling;
                const collapsed = !heading.classList.contains('collapsed');

                heading.classList.toggle('collapsed', collapsed);
                heading.setAttribute('aria-expanded', String(!collapsed));
                filesEl.hidden = collapsed;

                const hidden = getHiddenUnits(className);
                if (collapsed) hidden.add(unit); else hidden.delete(unit);
                setHiddenUnits(className, hidden);
            }

            fileListEl.addEventListener('click', (event) => {
                const heading = event.target.closest('.unit-heading');
                if (heading) toggleUnitSection(heading);
            });

            fileListEl.addEventListener('keydown', (event) => {
                if (event.key !== 'Enter' && event.key !== ' ') return;
                const heading = event.target.closest('.unit-heading');
                if (!heading) return;
                event.preventDefault();
                toggleUnitSection(heading);
            });
        }

        // --- Markdown Post-Processing ---
        // Run after putting rendered markdown on the page (inside a .markdown-body)
        // to turn on diagrams, copy buttons, email buttons, math, and in-page links.
        async function enhanceMarkdown(emailSubject) {
            // --- Mermaid Diagram Rendering ---
            // marked.js turns ```mermaid fences into <pre><code class="language-mermaid">.
            // Swap those for plain divs and let Mermaid render them into SVG.
            const mermaidBlocks = appDiv.querySelectorAll('.markdown-body pre code.language-mermaid');
            if (mermaidBlocks.length && window.mermaid) {
                mermaidBlocks.forEach((codeEl) => {
                    const graphDefinition = codeEl.textContent;
                    const container = document.createElement('div');
                    container.className = 'mermaid-diagram';
                    container.textContent = graphDefinition;
                    codeEl.closest('pre').replaceWith(container);
                });
                try {
                    mermaid.initialize({ startOnLoad: false, theme: getMermaidTheme() });
                    await mermaid.run({ querySelector: '.markdown-body .mermaid-diagram' });
                } catch (err) {
                    console.error('Mermaid render error:', err);
                }
            }

            // Highting code blocks with Highlight.js
            // appDiv.querySelectorAll('.markdown-body pre code').forEach((block) => {
            //     // marked.js adds a "language-X" class if you specify a language.
            //     // We only want to highlight if that class exists.
            //     if (block.className.includes('language-')) {
            //         hljs.highlightElement(block);
            //     } else {
            //         // For plain text blocks, just add the base class so it 
            //         // gets the correct background, but skips the auto-coloring
            //         block.classList.add('hljs'); 
            //     }
            // });
            
            const codeBlocks = appDiv.querySelectorAll('.markdown-body pre');
            
            codeBlocks.forEach(pre => {
                // Create the button element
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.textContent = 'Copy';
                
                // Add the click event to copy text
                copyBtn.addEventListener('click', () => {
                    // Find the actual <code> element inside the <pre>
                    const codeElement = pre.querySelector('code');
                    if (!codeElement) return;

                    // Use the modern clipboard API
                    navigator.clipboard.writeText(codeElement.innerText).then(() => {
                        // Give the user visual feedback
                        copyBtn.textContent = 'Copied!';
                        copyBtn.style.color = '#34d399'; // Turn green temporarily
                        copyBtn.style.borderColor = '#34d399';
                        
                        // Reset the button after 2 seconds
                        setTimeout(() => {
                            copyBtn.textContent = 'Copy';
                            copyBtn.style.color = '';
                            copyBtn.style.borderColor = '';
                        }, 2000);
                    }).catch(err => {
                        console.error('Failed to copy text: ', err);
                        copyBtn.textContent = 'Error';
                    });
                });
                
                // Append the button to the pre block
                pre.appendChild(copyBtn);
            });

            // --- Email Button Embed ---
            // In a markdown file, add: <email-button>Optional Label</email-button>
            // to render a button that opens a Gmail compose draft addressed to the
            // teacher, with the assignment title pre-filled as the subject.
            const teacherEmail = 'gormes@lps.k12.co.us';

            appDiv.querySelectorAll('.markdown-body email-button').forEach(placeholder => {
                const label = placeholder.textContent.trim() || 'Email Mr. Gormes';
                const btn = document.createElement('button');
                btn.className = 'email-btn';
                btn.type = 'button';
                btn.innerHTML = `✉️ ${label}`;
                btn.addEventListener('click', () => {
                    const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(teacherEmail)}&su=${encodeURIComponent(emailSubject)}`;
                    window.open(gmailUrl, '_blank', 'noopener');
                });
                placeholder.replaceWith(btn);
            });

            // --- Tabs ---
            // In a markdown file, wrap sections in <tabs> and <tab title="..."> to show one at a time:
            //     <tabs>
            //     <tab title="Regular Mode">
            //
            //     Any **markdown** here (leave the blank lines so it still renders as markdown).
            //
            //     </tab>
            //     <tab title="Another Tab">
            //
            //     More markdown.
            //
            //     </tab>
            //     </tabs>
            // This runs after Mermaid, so diagrams in hidden tabs are drawn at the right size.
            setUpTabs(appDiv);

            // We wrap this in a setTimeout of 0 to ensure the DOM has updated
            // and the KaTeX script has fully loaded before it tries to run.
            setTimeout(() => {
                if (window.renderMathInElement) {
                    renderMathInElement(appDiv, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true}, // Block math
                            {left: '$', right: '$', display: false}   // Inline math
                        ],
                        throwOnError: false // Prevents the whole page from breaking if you make a typo in your math
                    });
                }
            }, 0);

            const markdownLinks = appDiv.querySelectorAll('.markdown-body a');
            
            markdownLinks.forEach(link => {
                const href = link.getAttribute('href');
                
                // If the link starts with #, doesn't have a slash, and isn't a Class name
                if (href && href.startsWith('#') && !href.includes('/') && !curriculum[href.substring(1)]) {
                    
                    link.addEventListener('click', (e) => {
                        e.preventDefault(); // Stop the router from changing the page
                        
                        const targetId = href.substring(1);
                        const targetElement = document.getElementById(targetId);
                        
                        if (targetElement) {
                            // Smoothly scroll to the header!
                            targetElement.scrollIntoView({ behavior: 'smooth' });
                        }
                    });
                }
            });
        }

        // Turns each <tabs> block into a row of tab buttons with one visible panel.
        // The last tab title you picked (like "Explain It Like I'm 5") is remembered,
        // and opens first on any page that has a tab with the same title.
        let tabGroupCount = 0;
        function setUpTabs(root) {
            root.querySelectorAll('.markdown-body tabs').forEach(tabsEl => {
                const tabs = [...tabsEl.children].filter(child => child.tagName === 'TAB');
                if (!tabs.length) return;
                const groupId = `tabs-${++tabGroupCount}`;

                const container = document.createElement('div');
                container.className = 'tabs-container';
                const tabList = document.createElement('div');
                tabList.className = 'tab-list';
                tabList.setAttribute('role', 'tablist');
                container.appendChild(tabList);

                const buttons = [];
                const panels = [];
                tabs.forEach((tab, i) => {
                    const title = tab.getAttribute('title') || `Tab ${i + 1}`;
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'tab-btn';
                    button.id = `${groupId}-tab-${i}`;
                    button.textContent = title;
                    button.setAttribute('role', 'tab');
                    button.setAttribute('aria-controls', `${groupId}-panel-${i}`);
                    tabList.appendChild(button);
                    buttons.push(button);

                    const panel = document.createElement('div');
                    panel.className = 'tab-panel';
                    panel.id = `${groupId}-panel-${i}`;
                    panel.dataset.title = title;
                    panel.setAttribute('role', 'tabpanel');
                    panel.setAttribute('aria-labelledby', button.id);
                    panel.append(...tab.childNodes);
                    container.appendChild(panel);
                    panels.push(panel);
                });

                function select(index, remember = false) {
                    buttons.forEach((button, i) => {
                        const on = i === index;
                        button.setAttribute('aria-selected', String(on));
                        button.tabIndex = on ? 0 : -1;
                        panels[i].hidden = !on;
                    });
                    if (remember) localStorage.setItem('preferredTab', buttons[index].textContent);
                }

                buttons.forEach((button, i) => button.addEventListener('click', () => select(i, true)));
                // Arrow keys, Home, and End move between tabs, like tabs in other apps.
                tabList.addEventListener('keydown', (event) => {
                    const current = buttons.indexOf(document.activeElement);
                    if (current === -1) return;
                    const last = buttons.length - 1;
                    const next = { ArrowRight: current === last ? 0 : current + 1, ArrowLeft: current === 0 ? last : current - 1, Home: 0, End: last }[event.key];
                    if (next === undefined) return;
                    event.preventDefault();
                    select(next, true);
                    buttons[next].focus();
                });

                const preferred = buttons.findIndex(button => button.textContent === localStorage.getItem('preferredTab'));
                select(preferred === -1 ? 0 : preferred);
                tabsEl.replaceWith(container);
            });
        }

        // --- Course Outline Sidebar ---
        // On every file page, a panel on the left lists the whole class
        // (agendas, then each unit's warm-ups and files) so students can jump
        // between pages. Units fold open/closed in step with the class page.
        const sidebarEl = document.getElementById('course-sidebar');
        const sidebarOpenBtn = document.getElementById('sidebar-open-btn');
        const sidebarBackdrop = document.getElementById('sidebar-backdrop');
        const narrowScreen = window.matchMedia('(max-width: 899px)');
        let sidebarClass = null;

        // Wide screens remember whether the visitor hid the outline; narrow
        // screens always start with it tucked away so it doesn't cover the page.
        function setSidebarOpen(open, remember = true) {
            body.classList.toggle('sidebar-open', open);
            if (remember && !narrowScreen.matches) {
                localStorage.setItem('sidebarHidden', String(!open));
            }
        }
        setSidebarOpen(!narrowScreen.matches && localStorage.getItem('sidebarHidden') !== 'true', false);

        sidebarOpenBtn.addEventListener('click', () => setSidebarOpen(true));
        sidebarBackdrop.addEventListener('click', () => setSidebarOpen(false));
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && narrowScreen.matches && body.classList.contains('sidebar-open')) {
                setSidebarOpen(false);
            }
        });

        function sidebarLinkHTML(href, label, dotClass, isActive, title = '') {
            return `<a href="${href}" class="sidebar-link${isActive ? ' active' : ''}"${title ? ` title="${title}"` : ''}${isActive ? ' aria-current="page"' : ''}>
                <span class="sidebar-dot ${dotClass}"></span><span>${label}</span>
            </a>`;
        }

        function renderSidebar(className, currentPath) {
            const displayName = className.replace(/-/g, ' ');
            const hiddenUnits = getHiddenUnits(className);
            const publishedFiles = getPublishedFiles(className, curriculum[className]);
            const releasedWarmups = getReleasedWarmups(className);
            const releasedAgendas = getReleasedAgendas(className);

            const currentWarmup = currentPath.startsWith(`${WARMUP_FOLDER}/`)
                ? releasedWarmups.find(item => `${WARMUP_FOLDER}/${item.file}` === currentPath)
                : null;
            const currentFile = publishedFiles.find(item => item.file === currentPath);
            const currentUnit = currentWarmup ? (currentWarmup.unit ?? 0) : currentFile ? (currentFile.unit ?? 0) : null;

            let html = `
                <div class="sidebar-header">
                    <a href="#${className}" class="sidebar-class-link" title="Go to the class page">${displayName}</a>
                    <button type="button" id="sidebar-close-btn" class="sidebar-icon-btn" aria-label="Hide course outline" title="Hide course outline">«</button>
                </div>
            `;

            if (releasedAgendas.length) {
                const onAgenda = currentPath.startsWith(`${AGENDA_FOLDER}/`);
                html += `<details class="sidebar-unit"${onAgenda ? ' open' : ''}>
                    <summary>Agendas</summary>
                    ${releasedAgendas.map(date => sidebarLinkHTML(
                        `#${className}/${AGENDA_FOLDER}/${date}`,
                        formatWarmupDate(date),
                        '',
                        currentPath === `${AGENDA_FOLDER}/${date}`
                    )).join('')}
                </details>`;
            }

            const units = [...new Set([...publishedFiles, ...releasedWarmups].map(item => item.unit ?? 0))].sort((a, b) => a - b);
            units.forEach(unit => {
                const unitFiles = publishedFiles.filter(item => (item.unit ?? 0) === unit);
                const unitWarmups = releasedWarmups.filter(item => (item.unit ?? 0) === unit);
                const open = unit === currentUnit || !hiddenUnits.has(unit);

                let unitHtml = '';
                if (unitWarmups.length) {
                    const onWarmup = currentWarmup && (currentWarmup.unit ?? 0) === unit;
                    unitHtml += `<details class="sidebar-sub"${onWarmup ? ' open' : ''}>
                        <summary>Warm-Ups (${unitWarmups.length})</summary>
                        ${unitWarmups.map(item => sidebarLinkHTML(
                            `#${className}/${WARMUP_FOLDER}/${item.file}`,
                            item.file.replace(/-/g, ' '),
                            '',
                            currentWarmup === item,
                            formatWarmupDate(item.date)
                        )).join('')}
                    </details>`;
                }
                unitFiles.forEach(item => {
                    unitHtml += sidebarLinkHTML(
                        `#${className}/${item.file}`,
                        item.file.replace(/-/g, ' '),
                        getBadgeClass(item.type.toLowerCase()),
                        item === currentFile,
                        TYPE_FILTER_LABELS[item.type.toLowerCase()] || item.type
                    );
                });

                html += `<details class="sidebar-unit" data-unit="${unit}"${open ? ' open' : ''}>
                    <summary>${getUnitLabel(className, unit)}</summary>
                    ${unitHtml}
                </details>`;
            });

            // Keep the outline's scroll position when moving within the same class.
            const keepScroll = sidebarClass === className ? sidebarEl.scrollTop : 0;
            sidebarEl.innerHTML = html;
            sidebarEl.scrollTop = keepScroll;
            sidebarClass = className;
            body.classList.add('has-sidebar');

            sidebarEl.querySelector('.sidebar-link.active')?.scrollIntoView({ block: 'nearest' });

            document.getElementById('sidebar-close-btn').addEventListener('click', () => setSidebarOpen(false));
        }

        // Folding a unit in the outline folds it on the class page too.
        sidebarEl.addEventListener('click', (event) => {
            const summary = event.target.closest('.sidebar-unit[data-unit] > summary');
            if (summary && sidebarClass) {
                const details = summary.parentElement;
                const unit = Number(details.dataset.unit);
                const willCollapse = details.open; // The click is about to flip it.
                const hidden = getHiddenUnits(sidebarClass);
                if (willCollapse) hidden.add(unit); else hidden.delete(unit);
                setHiddenUnits(sidebarClass, hidden);
            }

            // On small screens, get the outline out of the way after picking a page.
            if (event.target.closest('a') && narrowScreen.matches) setSidebarOpen(false);
        });

        // --- Checklist Mode ---
        // Any file can have a step-by-step checklist version. To add one, save it at:
        //     markdown/<Class-Name>/Checklists/<Same-File-Name>.md
        // and write each step as a markdown task: "- [ ] Do the thing".
        // A "Checklist Mode" button then shows up on that file's page.
        // Students' checked boxes are saved in their own browser.
        const CHECKLIST_FOLDER = 'Checklists';

        // The checklist's markdown, or null if this file doesn't have one.
        async function fetchChecklist(className, assignmentName) {
            try {
                const response = await fetch(`markdown/${className}/${CHECKLIST_FOLDER}/${assignmentName}.md`);
                return response.ok ? await response.text() : null;
            } catch (e) {
                return null;
            }
        }

        function setUpChecklist(className, assignmentName) {
            const view = document.getElementById('checklist-view');
            const storageKey = `checklist-${className}/${assignmentName}`;
            const boxes = [...view.querySelectorAll('.checklist-body input[type="checkbox"]')];
            const barFill = view.querySelector('.checklist-bar span');
            const countEl = view.querySelector('.checklist-count');

            let saved = [];
            try { saved = JSON.parse(localStorage.getItem(storageKey)) || []; } catch (e) {}

            // Group the checklist into sections, one per "## Step" heading. Anything before
            // the first heading (the title and intro) always stays visible.
            const checklistBody = view.querySelector('.checklist-body');
            const sections = [];
            [...checklistBody.children].forEach(node => {
                if (node.tagName === 'H2') {
                    const section = document.createElement('section');
                    section.className = 'checklist-section';
                    node.before(section);
                    sections.push(section);
                }
                sections.at(-1)?.appendChild(node);
            });

            boxes.forEach((box, i) => {
                box.disabled = false;
                box.checked = !!saved[i];
                box.setAttribute('aria-label', 'Mark step done');
                box.closest('li')?.classList.add('task-item');
            });

            function update() {
                boxes.forEach(box => box.closest('li')?.classList.toggle('done', box.checked));
                const done = boxes.filter(box => box.checked).length;
                const percent = boxes.length ? Math.round((done / boxes.length) * 100) : 0;
                barFill.style.width = `${percent}%`;
                countEl.textContent = `${done} / ${boxes.length} steps done`;
                localStorage.setItem(storageKey, JSON.stringify(boxes.map(box => box.checked)));
                updateOneStep();
            }

            // --- One step at a time mode ---
            const stepper = view.querySelector('.checklist-stepper');
            const stepLabel = view.querySelector('.checklist-step-label');
            const backBtn = view.querySelector('.checklist-back-btn');
            const nextBtn = view.querySelector('.checklist-next-btn');
            let currentStep = null; // Index of the section being shown
            let advanceTimer = null;

            const sectionDone = (section) => [...section.querySelectorAll('input[type="checkbox"]')].every(box => box.checked);
            const firstUnfinished = () => sections.findIndex(section => !sectionDone(section));

            function showSections() {
                const on = isOneStepMode() && sections.length > 1;
                const allDone = firstUnfinished() === -1;
                stepper.hidden = !on;
                sections.forEach((section, i) => { section.hidden = on && !allDone && i !== currentStep; });
                if (!on) return;
                if (allDone) {
                    stepLabel.textContent = 'All steps done! Here is the whole checklist.';
                    backBtn.hidden = nextBtn.hidden = true;
                    return;
                }
                const heading = sections[currentStep].querySelector('h2')?.textContent ?? '';
                stepLabel.textContent = `${currentStep + 1} of ${sections.length}: ${heading.replace(/^Step \d+:\s*/, '')}`;
                backBtn.hidden = nextBtn.hidden = false;
                backBtn.disabled = currentStep === 0;
                // You can only move ahead once every box in this set is checked.
                nextBtn.disabled = currentStep === sections.length - 1 || !sectionDone(sections[currentStep]);
            }

            function goToStep(index) {
                clearTimeout(advanceTimer);
                currentStep = Math.max(0, Math.min(sections.length - 1, index));
                showSections();
                view.scrollIntoView({ block: 'start' });
            }

            function updateOneStep() {
                if (!sections.length) return;
                if (currentStep === null) currentStep = Math.max(0, firstUnfinished());
                clearTimeout(advanceTimer);
                showSections();
                // When the last box in this set gets checked, move on to the next unfinished set
                // after a short pause, so you can see the check mark land first.
                if (isOneStepMode() && sectionDone(sections[currentStep])) {
                    advanceTimer = setTimeout(() => {
                        const next = firstUnfinished();
                        if (next === -1) { showSections(); view.scrollIntoView({ block: 'start' }); }
                        else if (next > currentStep) goToStep(next);
                    }, 700);
                }
            }

            backBtn.addEventListener('click', () => goToStep(currentStep - 1));
            nextBtn.addEventListener('click', () => goToStep(currentStep + 1));
            refreshOneStep = () => {
                if (!view.isConnected) return;
                currentStep = Math.max(0, firstUnfinished());
                updateOneStep();
            };

            view.addEventListener('change', (event) => {
                if (boxes.includes(event.target)) update();
            });

            // Clicking anywhere on a step's line checks it off, including inline code and images.
            // Links, buttons, code blocks (so code can be copied), and dropdowns still work normally.
            view.addEventListener('click', (event) => {
                if (event.target.closest('input, a, button, pre, summary, details')) return;
                if (String(window.getSelection())) return; // Dragging to select text shouldn't check the box.
                const li = event.target.closest('li.task-item');
                if (!li) return;
                const box = li.querySelector(':scope > input[type="checkbox"], :scope > p > input[type="checkbox"]');
                if (!box) return;
                box.checked = !box.checked;
                update();
            });

            view.querySelector('.checklist-reset-btn').addEventListener('click', () => {
                if (!confirm('Uncheck every step?')) return;
                boxes.forEach(box => { box.checked = false; });
                currentStep = 0;
                update();
            });

            update();
        }

        // --- 6. RENDER INDIVIDUAL FILE ---
        async function renderAssignment(className, assignmentName) {
            if (curriculum[className]) renderSidebar(className, assignmentName);
            appDiv.innerHTML = `<p>Loading...</p>`;
            window.scrollTo(0, 0); // Start each newly opened page at the top.
            try {
                // Look for a matching checklist at the same time as the page itself.
                const isWarmupOrAgenda = assignmentName.startsWith(`${WARMUP_FOLDER}/`) || assignmentName.startsWith(`${AGENDA_FOLDER}/`);
                const [response, checklistText] = await Promise.all([
                    fetch(`markdown/${className}/${assignmentName}.md`),
                    isWarmupOrAgenda ? null : fetchChecklist(className, assignmentName)
                ]);
                if (!response.ok) throw new Error('Markdown file not found.');

                const markdownText = await response.text();
                let htmlContent = marked.parse(markdownText); 

                // Warm-up files hold only the question, so add their title, date, and unit.
                const isWarmup = assignmentName.startsWith(`${WARMUP_FOLDER}/`);
                if (isWarmup) {
                    const file = assignmentName.substring(WARMUP_FOLDER.length + 1);
                    const warmup = (warmups[className] || []).find(item => item.file === file);
                    const details = warmup
                        ? ` · ${formatWarmupDate(warmup.date)} · ${getUnitLabel(className, warmup.unit ?? 0)}`
                        : '';
                    htmlContent = `
                        <h1>${file.replace(/-/g, ' ')}</h1>
                        <p class="day-meta"><span class="day-label">Warm-Up</span>${details}</p>
                        ${htmlContent}
                    `;
                }

                // Agenda files are named by date, so give them a readable title.
                const isAgenda = assignmentName.startsWith(`${AGENDA_FOLDER}/`);
                if (isAgenda) {
                    const date = assignmentName.substring(AGENDA_FOLDER.length + 1);
                    htmlContent = `
                        <h1>${formatWarmupDate(date)}</h1>
                        <p class="day-meta"><span class="day-label">Agenda</span></p>
                        ${htmlContent}
                    `;
                }
                
                // Syllabi get a button that opens the print dialog, where students can "Save as PDF".
                const isSyllabus = assignmentName.endsWith('-Syllabus');

                const hasChecklist = typeof checklistText === 'string';
                // Open in the visitor's default view (Style menu). No checklist? Always the full lab.
                const startInChecklist = hasChecklist && getDefaultLabView() === 'checklist';

                appDiv.innerHTML = `
                    <div class="nav-buttons">
                        <a href="#${className}" class="btn">← Back to Class</a>
                        <div class="nav-right">
                            ${hasChecklist ? `<button type="button" id="checklist-toggle-btn" class="btn" aria-pressed="${startInChecklist}"></button>` : ''}
                            ${isSyllabus ? '<button type="button" id="export-pdf-btn" class="btn">Export to PDF</button>' : ''}
                        </div>
                    </div>
                    <div id="full-view" class="markdown-body${isWarmup ? ' warmup-content' : ''}"${startInChecklist ? ' hidden' : ''}>
                        ${htmlContent}
                    </div>
                    ${hasChecklist ? `
                    <div id="checklist-view"${startInChecklist ? '' : ' hidden'}>
                        <div class="checklist-progress">
                            <div class="checklist-bar"><span></span></div>
                            <span class="checklist-count"></span>
                            <button type="button" class="btn checklist-reset-btn">Reset</button>
                        </div>
                        <div class="checklist-stepper" hidden>
                            <button type="button" class="btn checklist-back-btn">← Back</button>
                            <span class="checklist-step-label" aria-live="polite"></span>
                            <button type="button" class="btn checklist-next-btn">Next →</button>
                        </div>
                        <div class="markdown-body checklist-body">
                            ${marked.parse(checklistText)}
                        </div>
                    </div>` : ''}
                `;
                await enhanceMarkdown(assignmentName.split('/').pop().replace(/-/g, ' '));

                if (hasChecklist) {
                    setUpChecklist(className, assignmentName);

                    const toggleBtn = document.getElementById('checklist-toggle-btn');
                    const fullView = document.getElementById('full-view');
                    const checklistView = document.getElementById('checklist-view');

                    function showChecklist(on) {
                        fullView.hidden = on;
                        checklistView.hidden = !on;
                        toggleBtn.textContent = on ? 'Full Lab View' : 'Checklist Mode';
                        toggleBtn.setAttribute('aria-pressed', String(on));
                    }
                    showChecklist(startInChecklist);
                    // The button switches views for this visit only; the Style menu sets the default.
                    toggleBtn.addEventListener('click', () => {
                        showChecklist(checklistView.hidden);
                        window.scrollTo(0, 0);
                    });
                    toggleBtn.addEventListener('set-view', (event) => showChecklist(event.detail === 'checklist'));
                }

                if (isSyllabus) {
                    document.getElementById('export-pdf-btn').addEventListener('click', () => {
                        // The browser uses the page title as the default PDF file name.
                        const originalTitle = document.title;
                        document.title = assignmentName;
                        window.addEventListener('afterprint', () => { document.title = originalTitle; }, { once: true });
                        window.print();
                    });
                }

            } catch (error) {
                appDiv.innerHTML = `
                    <div class="nav-buttons"><a href="#${className}" class="btn">← Back to Class</a></div>
                    <div class="error">
                        <strong>Error:</strong> Could not load <code>markdown/${className}/${assignmentName}.md</code>. <br>
                        Make sure the file exists and that you are running a local web server.
                    </div>
                `;
            }
        }

        // --- 7. EVENT LISTENERS ---
        window.addEventListener('hashchange', render);
        render();
    </script>
</body>
</html>
